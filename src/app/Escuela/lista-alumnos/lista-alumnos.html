<br><br><br><br><br><br>
<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
 
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Registro Alumnos
  </h1>
 
  <form [formGroup]="formulario">
 
    <!-- Matricula -->
    <div class="mb-5">
      <label
        for="matricula"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Matricula
      </label>
      <input
        type="text"
        id="matricula"
        name="matricula"
        formControlName="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Escribe tu matricula"
      >
    </div>

    <!-- Nombre -->
    <div class="mb-5">
      <label
        for="nombre"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>
      <input
        type="text"
        id="nombre"
        name="nombre"
         formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Escribe tu nombre"
      >
    </div>

    <!-- Correo -->
    <div class="mb-5">
      <label
        for="correo"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Correo
      </label>
      <input
        type="text"
        id="correo"
        name="correo"
         formControlName="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Escribe tu correo"
      >
    </div>

    <!-- Materia -->
    <div class="mb-5">
      <label
        for="materia"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Materia
      </label>
      <input
        type="text"
        id="materia"
        name="materia"
         formControlName="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Escribe tu materia"
      >
    </div>
 
    <!-- Botón -->
    <div class="flex justify-end mt-5">
      <button
        type="submit"
        (click)="muestraAlumnos()"
        class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Enviar
      </button>
    </div>
 
  </form>

  <h1>LISTA ALUMNO</h1>
  <h2>Matricula: {{nuevoAlumno.matricula}}</h2>
  <h2>Nombre: {{nuevoAlumno.nombre}}</h2>
  <h2>Correo: {{nuevoAlumno.correo}}</h2>
  <h2>Materia: {{nuevoAlumno.materia}}</h2>
 
</div>
